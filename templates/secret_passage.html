<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Passage</title>
    <link rel="stylesheet" href="/static/css/secret_passage.css">
</head>
<body>
    <h1> <span class="top_text"> {{user_name}} is in the secret passage </span> </h1>
    <h2> <span class="top_text"> Find a way to break out. </span> </h2>
    <h3> <span class="top_text"> Lumos, Lumos, Lumos </span> </h3>

    <div class="rectangle"></div>
    <span class="timer_format"> Seconds Remaining: </span>
    <span id="timer">{{the_timer}}</span>

    <button class="circle_button" onclick="countClicks()"></button>

    <script src = "/static/js/secret_passage.js"></script>

    <script>
        let timer = parseInt(document.getElementById('timer').innerText);
        let t = document.getElementById('timer');

        let countdown = setInterval(() => {
            timer -= 1;
            t.innerText = timer;
            if (timer <= 0) {
                clearInterval(countdown);
                window.location.href = '/failed_escape';
            }
        }, 1000);
    </script>

</body>
</html>
